name: wispnote

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wispnote
      POSTGRES_USER: wispnote
      POSTGRES_PASSWORD: wispnote
    volumes:
      - ./apps/backend/.platform/postgres/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wispnote -d wispnote"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: docker/java-dev
    volumes:
      - ./apps/backend:/app
      - m2:/root/.m2
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/wispnote
      RABBITMQ_HOST: rabbitmq
    ports:
      - "127.0.0.1:8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8090'"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 60s

  analyzer:
    build: docker/java-dev
    volumes:
      - ./apps/analyzer:/app
      - m2:/root/.m2
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
    ports:
      - "127.0.0.1:8096:8096"
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  pgdata:
  m2:
