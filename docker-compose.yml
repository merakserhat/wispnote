name: wispnote

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wispnote
      POSTGRES_USER: wispnote
      POSTGRES_PASSWORD: wispnote
    volumes:
      - ./apps/backend/.platform/postgres/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wispnote -d wispnote"]
      interval: 5s
      timeout: 5s
      retries: 10

  pubsub:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    entrypoint: ["bash", "/start.sh"]
    volumes:
      - ./docker/pubsub/start.sh:/start.sh:ro
    ports:
      - "127.0.0.1:8085:8085"
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 5s
      timeout: 5s
      retries: 24

  backend:
    build: docker/java-dev
    volumes:
      - ./apps/backend:/app
      - m2:/root/.m2
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/wispnote
      PUBSUB_EMULATOR_HOST: pubsub:8085
      ANALYZER_BASE_URL: http://analyzer:8096
      MAIL_PROVIDER: ${MAIL_PROVIDER:-mock}
      MAIL_FROM: ${MAIL_FROM:-noreply@wispnote.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-WispNote}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      GOOGLE_PROVIDER: ${GOOGLE_PROVIDER:-mock}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
      pubsub:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8090'"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 60s

  analyzer:
    build: docker/java-dev
    volumes:
      - ./apps/analyzer:/app
      - m2:/root/.m2
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/wispnote_analyzer
      BACKEND_BASE_URL: http://backend:8090
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "127.0.0.1:8096:8096"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  m2:
