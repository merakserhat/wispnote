server.forward-headers-strategy=framework

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${POSTGRES_USERNAME}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

## Flyway Configuration
spring.flyway.enabled=true

## Access Token Signing Key
rsa.access-token.private-key=${ACCESS_TOKEN_PRIVATE_KEY}
rsa.access-token.public-key=${ACCESS_TOKEN_PUBLIC_KEY}

## Refresh Token Signing Key
rsa.refresh-token.private-key=${REFRESH_TOKEN_PRIVATE_KEY}
rsa.refresh-token.public-key=${REFRESH_TOKEN_PUBLIC_KEY}

# Messaging
message-publisher.provider=pubsub
spring.cloud.gcp.project-id=${GCP_PROJECT_ID}

# Internal clients (authorization server, client_credentials)
spring.security.oauth2.authorizationserver.client.analyzer.registration.client-id=analyzer
spring.security.oauth2.authorizationserver.client.analyzer.registration.client-secret=${ANALYZER_CLIENT_SECRET_HASH}
spring.security.oauth2.authorizationserver.client.analyzer.registration.client-authentication-methods=client_secret_basic
spring.security.oauth2.authorizationserver.client.analyzer.registration.authorization-grant-types=client_credentials
spring.security.oauth2.authorizationserver.client.analyzer.registration.scopes=SERVICE
spring.security.oauth2.authorizationserver.client.analyzer.token.access-token-time-to-live=3h

spring.security.oauth2.authorizationserver.client.backend.registration.client-id=backend
spring.security.oauth2.authorizationserver.client.backend.registration.client-secret=${BACKEND_CLIENT_SECRET_HASH}
spring.security.oauth2.authorizationserver.client.backend.registration.client-authentication-methods=client_secret_basic
spring.security.oauth2.authorizationserver.client.backend.registration.authorization-grant-types=client_credentials
spring.security.oauth2.authorizationserver.client.backend.registration.scopes=SERVICE
spring.security.oauth2.authorizationserver.client.backend.token.access-token-time-to-live=3h

# Analyzer internal API (this service is a client of its own authorization server)
analyzer.provider=rest
analyzer.base-url=${ANALYZER_BASE_URL}
analyzer.read-timeout=5s
analyzer.client-registration-id=backend

spring.security.oauth2.client.registration.backend.provider=wispnote-backend
spring.security.oauth2.client.registration.backend.client-id=backend
spring.security.oauth2.client.registration.backend.client-secret=${BACKEND_CLIENT_SECRET}
spring.security.oauth2.client.registration.backend.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.backend.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.backend.scope=SERVICE
spring.security.oauth2.client.provider.wispnote-backend.token-uri=${BACKEND_SELF_URL}/oauth2/token

# Mail
mail.provider=smtp
mail.from=${MAIL_FROM}
mail.from-name=${MAIL_FROM_NAME:WispNote}
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Google sign-in
google.provider=rest
google.client-id=${GOOGLE_CLIENT_ID}
google.client-secret=${GOOGLE_CLIENT_SECRET}
google.token-uri=https://oauth2.googleapis.com/token
google.issuer=https://accounts.google.com
google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs
google.read-timeout=5s
