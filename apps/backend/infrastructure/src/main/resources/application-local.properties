server.port=8090

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/wispnote
spring.datasource.username=${POSTGRES_USERNAME:wispnote}
spring.datasource.password=${POSTGRES_PASSWORD:wispnote}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

## Flyway Configuration
spring.flyway.enabled=true

## Access Token Signing Key
rsa.access-token.private-key=${ACCESS_TOKEN_PRIVATE_KEY:classpath:keys/access-token.pem}
rsa.access-token.public-key=${ACCESS_TOKEN_PUBLIC_KEY:classpath:keys/access-token.pub}

## Refresh Token Signing Key
rsa.refresh-token.private-key=${REFRESH_TOKEN_PRIVATE_KEY:classpath:keys/refresh-token.pem}
rsa.refresh-token.public-key=${REFRESH_TOKEN_PUBLIC_KEY:classpath:keys/refresh-token.pub}

# Messaging
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.connection-timeout=5s
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.initial-interval=2s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Internal clients (authorization server, client_credentials)
spring.security.oauth2.authorizationserver.client.analyzer.registration.client-id=${ANALYZER_CLIENT_ID:analyzer}
spring.security.oauth2.authorizationserver.client.analyzer.registration.client-secret=${ANALYZER_CLIENT_SECRET_HASH:$2y$12$LsBFxWfcGwUUHi2W7P6JxuqtZqEJB.U2Eq5Jfaa3KbUEDahphs4M6}
spring.security.oauth2.authorizationserver.client.analyzer.registration.client-authentication-methods=client_secret_basic
spring.security.oauth2.authorizationserver.client.analyzer.registration.authorization-grant-types=client_credentials
spring.security.oauth2.authorizationserver.client.analyzer.registration.scopes=SERVICE
spring.security.oauth2.authorizationserver.client.analyzer.token.access-token-time-to-live=3h

spring.security.oauth2.authorizationserver.client.backend.registration.client-id=${BACKEND_CLIENT_ID:backend}
spring.security.oauth2.authorizationserver.client.backend.registration.client-secret=${BACKEND_CLIENT_SECRET_HASH:$2y$12$YvcfJgLdpiisTgnyKPjDteN2oDg3YKOR9rXr3Vf45SpIPIbermSjy}
spring.security.oauth2.authorizationserver.client.backend.registration.client-authentication-methods=client_secret_basic
spring.security.oauth2.authorizationserver.client.backend.registration.authorization-grant-types=client_credentials
spring.security.oauth2.authorizationserver.client.backend.registration.scopes=SERVICE
spring.security.oauth2.authorizationserver.client.backend.token.access-token-time-to-live=3h

# Analyzer internal API (this service is a client of its own authorization server)
analyzer.provider=${ANALYZER_PROVIDER:rest}
analyzer.base-url=${ANALYZER_BASE_URL:http://localhost:8096}
analyzer.read-timeout=5s
analyzer.client-registration-id=backend

spring.security.oauth2.client.registration.backend.provider=wispnote-backend
spring.security.oauth2.client.registration.backend.client-id=${BACKEND_CLIENT_ID:backend}
spring.security.oauth2.client.registration.backend.client-secret=${BACKEND_CLIENT_SECRET:backend-secret}
spring.security.oauth2.client.registration.backend.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.backend.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.backend.scope=SERVICE
spring.security.oauth2.client.provider.wispnote-backend.token-uri=${BACKEND_SELF_URL:http://localhost:8090}/oauth2/token

# Mail
mail.provider=${MAIL_PROVIDER:mock}
mail.from=${MAIL_FROM:noreply@wispnote.local}
mail.from-name=${MAIL_FROM_NAME:WispNote}
mail.exchange=wispnote.mail
mail.queue=wispnote.mail.smtp
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Google sign-in
google.provider=${GOOGLE_PROVIDER:mock}
google.client-id=${GOOGLE_CLIENT_ID:}
google.client-secret=${GOOGLE_CLIENT_SECRET:}
google.token-uri=https://oauth2.googleapis.com/token
google.issuer=https://accounts.google.com
google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs
google.read-timeout=5s
