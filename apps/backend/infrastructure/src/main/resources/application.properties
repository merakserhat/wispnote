spring.application.name=wispnote-backend
server.shutdown=graceful

logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# JPA
spring.jpa.open-in-view=false

# JSON
spring.jackson.default-property-inclusion=non_null

## Flyway Configuration
spring.flyway.enabled=false

# Messaging
message-publisher.provider=${MESSAGE_PUBLISHER_PROVIDER:rabbitmq}
message-publisher.notes-exchange=wispnote.notes
message-publisher.analyzer-queue=wispnote.notes.analyzer
message-publisher.automations-exchange=wispnote.automations
message-publisher.automations-analyzer-queue=wispnote.automations.analyzer
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true

# Email verification
email-verification.expires-in=10m
email-verification.max-wrong-attempts=5
email-verification.max-sends-per-window=3
email-verification.send-window=24h

# Mail
management.health.mail.enabled=false
