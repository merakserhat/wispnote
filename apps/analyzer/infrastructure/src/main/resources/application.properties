spring.application.name=wispnote-analyzer
server.shutdown=graceful

logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# JPA
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=false

# Messaging (Pub/Sub push)
pubsub.push.issuer=https://accounts.google.com
pubsub.push.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs
pubsub.push.audience=${PUBSUB_PUSH_AUDIENCE:}
pubsub.push.service-account-email=${PUBSUB_PUSH_SERVICE_ACCOUNT_EMAIL:}
