server.port=0

# Database: Testcontainers injects the datasource through @ServiceConnection
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true

# Messaging
rabbitmq.enabled=false

# Backend internal API
backend.provider=mock
backend.base-url=http://localhost:8090
backend.read-timeout=5s
backend.client-registration-id=analyzer

spring.security.oauth2.client.registration.analyzer.provider=wispnote-backend
spring.security.oauth2.client.registration.analyzer.client-id=analyzer
spring.security.oauth2.client.registration.analyzer.client-secret=analyzer-secret
spring.security.oauth2.client.registration.analyzer.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.analyzer.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.analyzer.scope=SERVICE
spring.security.oauth2.client.provider.wispnote-backend.token-uri=http://localhost:8090/oauth2/token

# LLM-backed automation checks (action detection)
llm.provider=mock
