server.port=8096

# Messaging
rabbitmq.enabled=true
rabbitmq.dead-letter-exchange=analyzer.dlx
rabbitmq.note-created-exchange=note.created
rabbitmq.note-created-queue=note.created.analyzer
rabbitmq.note-created-routing-key=note.created.analyzer
rabbitmq.note-enriched-exchange=note.enriched
rabbitmq.note-enriched-queue=note.enriched.analyzer
rabbitmq.note-enriched-routing-key=note.enriched.analyzer

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.initial-interval=2s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# LLM
llm.provider=claude-code
llm.claude-code.binary=${CLAUDE_BINARY:claude}
llm.claude-code.working-directory=${LLM_WORKING_DIR:/tmp/analyzer-llm}
llm.claude-code.timeout=120s

llm.anthropic-api.api-key=${ANTHROPIC_API_KEY:}
llm.anthropic-api.timeout=60s
llm.anthropic-api.models.classify=claude-opus-5
llm.anthropic-api.models.enrich=claude-opus-5
llm.anthropic-api.max-tokens.classify=4096
llm.anthropic-api.max-tokens.enrich=16000
