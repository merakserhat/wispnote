server.port=8096

# Messaging
rabbitmq.enabled=true
rabbitmq.dead-letter-exchange=analyzer.dlx
rabbitmq.notes-exchange=wispnote.notes
rabbitmq.notes-queue=wispnote.notes.analyzer
rabbitmq.automations-exchange=wispnote.automations
rabbitmq.automations-queue=wispnote.automations.analyzer

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.initial-interval=2s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Backend internal API
backend.provider=${BACKEND_PROVIDER:rest}
backend.base-url=${BACKEND_BASE_URL:http://localhost:8090}
backend.read-timeout=5s
backend.client-registration-id=analyzer

spring.security.oauth2.client.registration.analyzer.provider=wispnote-backend
spring.security.oauth2.client.registration.analyzer.client-id=${ANALYZER_CLIENT_ID:analyzer}
spring.security.oauth2.client.registration.analyzer.client-secret=${ANALYZER_CLIENT_SECRET:analyzer-secret}
spring.security.oauth2.client.registration.analyzer.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.analyzer.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.analyzer.scope=SERVICE
spring.security.oauth2.client.provider.wispnote-backend.token-uri=${BACKEND_BASE_URL:http://localhost:8090}/oauth2/token
