server.forward-headers-strategy=framework

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${POSTGRES_USERNAME}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true

# Messaging (Pub/Sub push)
pubsub.push.verification=google
pubsub.push.audience=${PUBSUB_PUSH_AUDIENCE}
pubsub.push.service-account-email=${PUBSUB_PUSH_SERVICE_ACCOUNT_EMAIL}

# Backend internal API
backend.provider=rest
backend.base-url=${BACKEND_BASE_URL}
backend.read-timeout=5s
backend.client-registration-id=analyzer

spring.security.oauth2.client.registration.analyzer.provider=wispnote-backend
spring.security.oauth2.client.registration.analyzer.client-id=analyzer
spring.security.oauth2.client.registration.analyzer.client-secret=${ANALYZER_CLIENT_SECRET}
spring.security.oauth2.client.registration.analyzer.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.analyzer.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.analyzer.scope=SERVICE
spring.security.oauth2.client.provider.wispnote-backend.token-uri=${BACKEND_BASE_URL}/oauth2/token

# Internal API (resource server, service tokens issued by the backend)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${BACKEND_BASE_URL}/oauth2/jwks

# LLM-backed automation checks (action detection)
llm.provider=openai
openai.api-key=${OPENAI_API_KEY}
openai.model=${OPENAI_MODEL:gpt-5-mini}
openai.max-output-tokens=2048
openai.reasoning-effort=low
openai.timeout=15s
openai.max-retries=3
